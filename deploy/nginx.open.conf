events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    upstream pathmemos_http {
        server app:8080;
        keepalive 32;
    }

    upstream pathmemos_sse {
        server app:8081;
        keepalive 32;
    }

    limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=upload:10m rate=10r/s;

    server {
        listen 80 default_server;
        server_name _;

        gzip on;
        gzip_vary on;
        gzip_proxied expired no-cache no-store private auth;
        gzip_comp_level 5;
        gzip_min_length 256;
        gzip_types application/json application/javascript text/javascript text/css text/plain text/xml image/svg+xml;

        server_tokens off;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        client_max_body_size 50m;

        if ($host = "") {
            return 444;
        }

        location /uploads/ {
            alias /opt/pathmemos/uploads/;
            limit_req zone=upload burst=20 nodelay;
            location ~ \.\. {
                return 403;
            }
            expires 30d;
            add_header Cache-Control "public, immutable";
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            etag on;
            if_modified_since exact;
        }

        location /system-assets/ {
            alias /opt/pathmemos/deploy/assets/system/;
            location ~ \.\. {
                return 403;
            }
            expires 30d;
            add_header Cache-Control "public, immutable";
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            etag on;
            if_modified_since exact;
        }

        location /ai/chat {
            limit_req zone=api burst=50 nodelay;
            proxy_pass http://pathmemos_sse;
            proxy_http_version 1.1;
            proxy_set_header Connection '';
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
        }

        location / {
            limit_req zone=api burst=50 nodelay;
            proxy_pass http://pathmemos_http;
            proxy_http_version 1.1;
            proxy_set_header Connection '';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }
    }
}
