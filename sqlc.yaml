version: "2"
sql:
  - engine: "postgresql"
    queries: "./backend/internal/db/sqlc/"
    schema: "./backend/migrations/"
    gen:
      go:
        package: "sqlc"
        out: "./backend/internal/db/sqlc"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_prepared_queries: false
        emit_interface: true
        emit_exact_table_names: false
        emit_empty_slices: true
        json_tags_case_style: "camel"
